services:
  api:
    build:
      context: .
      args:
        - BASE_IMAGE=python:3.13-slim-bookworm
    image: moex_predict_api:latest
    container_name: moex_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5001
      - API_PORT=5000
      - HISTORY_DIR=/data/history
      - DATA_CACHE_DIR=/data/data_cache
      - MODEL_ARTIFACTS_DIR=/data/models
    volumes:
      - ./history:/data/history
      - ./data_cache:/data/data_cache
      - ./models:/data/models
      - ./mlflow:/mlflow
    ports:
      - "5000:5000"
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mlflow:
    image: python:3.13-slim-bookworm
    container_name: mlflow_server
    restart: unless-stopped
    volumes:
      - ./mlflow:/mlflow
    environment:
      - MLFLOW_ARTIFACT_ROOT=/mlflow/artifacts
    command: /bin/sh -c "apt-get update && apt-get install -y curl && \
                        pip install --no-cache-dir mlflow==2.21.3 sqlalchemy alembic && \
                        mkdir -p /mlflow/artifacts && \
                        rm -f /mlflow/mlflow.db && \
                        mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db \
                                      --default-artifact-root /mlflow/artifacts \
                                      --host 0.0.0.0 --port 5001"
    ports:
      - "5001:5001"