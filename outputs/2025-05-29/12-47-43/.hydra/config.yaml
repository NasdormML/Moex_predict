version_base: 1
project:
  name: Moex_predict
data:
  ticker: SBER
  batch_size: 64
  shuffle: true
  num_workers: 4
model:
  name: lstm
  params:
    seq_length: 20
    num_features: 18
    output_dim: 1
    lstm_units: 240
    fc_units: 127
    dropout_rate: 0.1335
train:
  version: v1
  model_artifacts_dir: saved_models
  lr: 0.001
  epochs: 20
