name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: contains(fromJson('["github-actions[bot]", "dependabot[bot]"]'), github.actor)
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Show PR info
        run: |
          echo "PR: #${{ github.event.pull_request.number }}"
          gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json number,title,author,state

      - name: Get changed files
        id: files
        run: |
          PR="${{ github.event.pull_request.number }}"
          FILES=$(gh pr diff $PR --repo ${{ github.repository }} --name-only)
          echo "Changed files:"
          echo "$FILES"
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Decide whether to merge (only requirements files)
        id: decide
        run: |
          set -euo pipefail
          FILES="${{ steps.files.outputs.list }}"

          if [ -z "$FILES" ]; then
            echo "No files changed — skipping."
            echo "merge=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NON_REQ=""
          while IFS= read -r f; do
            f="$(echo "$f" | tr -d '\r')"
            [ -z "$f" ] && continue
            
            # Проверяем различные варианты requirements файлов
            if echo "$f" | grep -Eq 'requirements.*\.(txt|in)$'; then
              continue
            else
              NON_REQ="$NON_REQ $f"
            fi
          done <<< "$FILES"

          if [ -n "$NON_REQ" ]; then
            echo "Found non-requirements files changed: $NON_REQ"
            echo "merge=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "All changed files are requirements-related. Proceed to merge."
          echo "merge=true" >> $GITHUB_OUTPUT

      - name: Enable auto-merge (squash when checks pass)
        if: steps.decide.outputs.merge == 'true'
        run: |
          PR="${{ github.event.pull_request.number }}"
          
          # Пробуем включить auto-merge (сливать когда чеки пройдут)
          gh pr merge $PR --repo ${{ github.repository }} --squash --auto --body "Auto-merged: dependency update" || {
            echo "Auto-merge не удался, пробуем прямой merge..."
            # Если чеки уже прошли, пробуем сразу смержить
            gh pr merge $PR --repo ${{ github.repository }} --squash --body "Auto-merged: dependency update"
          }

      - name: Skip - not requirements
        if: steps.decide.outputs.merge == 'false'
        run: |
          echo "PR contains non-requirements changes — skipping auto-merge."
