name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      contains('github-actions[bot],dependabot[bot]', github.actor)
    steps:
      - name: Authenticate gh CLI
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "$GH_TOKEN" | gh auth login --with-token

      - name: Show PR info
        run: |
          echo "PR: #${{ github.event.pull_request.number }}"
          gh pr view ${{ github.event.pull_request.number }} --json number,title,author

      - name: Get changed files
        id: files
        run: |
          PR="${{ github.event.pull_request.number }}"
          FILES=$(gh pr diff --name-only $PR)
          echo "Changed files:"
          echo "$FILES"
          echo "::set-output name=list::$FILES"

      - name: Decide whether to merge (only requirements files)
        id: decide
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          FILES="${{ steps.files.outputs.list }}"

          if [ -z "$FILES" ]; then
            echo "No files changed — skipping."
            echo "merge=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NON_REQ=""
          while IFS= read -r f; do
            f="$(echo "$f" | tr -d '\r')"
            if [ -z "$f" ]; then
              continue
            fi
            if echo "$f" | grep -Eq '(?:^|/)(requirements|requirements.*|requirements\.txt|requirements\.in)$'; then
              continue
            else
              NON_REQ="$NON_REQ $f"
            fi
          done <<< "$FILES"

          if [ -n "$NON_REQ" ]; then
            echo "Found non-requirements files changed: $NON_REQ"
            echo "merge=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "All changed files are requirements-related. Proceed to merge."
          echo "merge=true" >> $GITHUB_OUTPUT

      - name: Enable auto-merge (set PR to auto-merge when checks pass)
        if: steps.decide.outputs.merge == 'true'
        run: |
          PR="${{ github.event.pull_request.number }}"
          gh pr merge $PR --squash --auto --body "Auto-merged when checks pass" || {
            echo "gh pr merge returned non-zero. Trying direct merge (if checks already passed)."
            gh pr merge $PR --squash --admin || {
              echo "Merge attempt failed."
              exit 1
            }
          }

      - name: Skip - not requirements
        if: steps.decide.outputs.merge == 'false'
        run: |
          echo "PR contains non-requirements changes — skipping auto-merge."
