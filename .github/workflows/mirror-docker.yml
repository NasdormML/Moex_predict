name: Mirror Docker Hub to GHCR

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and push
        run: |
          docker pull your-dockerhub-user/image:tag
          docker tag your-dockerhub-user/image:tag ghcr.io/${{ github.repository_owner }}/image:tag
          docker push ghcr.io/${{ github.repository_owner }}/image:tag