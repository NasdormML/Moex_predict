enable: false
n_trials: 10
epochs_per_trial: 5
weight_decay: 1e-5
lr_range: [1e-4, 1e-2]
use_scheduler: true
scheduler_factor: 0.5
scheduler_patience: 1
use_hyperband: false
sh_reduction_factor: 3
n_startup_trials: 5
n_jobs: 1

search_space:

  # =========================================
  # Квантильные параметры (общие для всех quantile_* моделей)
  # =========================================
  quantiles:
    - [0.05, 0.5, 0.95]

  # =========================================
  # TFT (Temporal Fusion Transformer)
  # =========================================
  tft_d_model:
    - 32
    - 64
    - 128
    - 256
    - 512
  tft_n_heads:
    - 1
    - 2
    - 4
    - 8
  tft_n_layers:
    - 1
    - 2
    - 3
    - 4
  tft_d_ff:
    - 128
    - 256
    - 512
  tft_dropout:
    - 0.0
    - 0.1
    - 0.2
    - 0.3

  # =========================================
  # LSTM-Attention
  # =========================================
  lstm_units:
    - 32
    - 64
    - 128
    - 256
    - 512
  lstm_fc_units:
    - 32
    - 64
    - 128
    - 256
  lstm_dropout:
    - 0.0
    - 0.1
    - 0.2
    - 0.3

  # =========================================
  # TCN (Temporal Convolutional Network)
  # =========================================
  tcn_num_channels:
    - [64, 128]
    - [128, 256, 512]
    - [64, 128, 256, 512]
  tcn_kernel_size:
    - 3
    - 5
    - 7
    - 9
  tcn_dropout:
    - 0.0
    - 0.1
    - 0.2
    - 0.3

  # =========================================
  # Autoformer
  # =========================================
  autoformer_d_model:
    - 32
    - 64
    - 128
    - 256
  autoformer_n_heads:
    - 1
    - 2
    - 4
    - 8
  autoformer_num_layers:
    - 1
    - 2
    - 3
    - 4
  autoformer_d_ff:
    - 128
    - 256
    - 512
  autoformer_dropout:
    - 0.0
    - 0.1
    - 0.2
    - 0.3
  autoformer_kernel_size:
    - 5
    - 15
    - 25
    - 51